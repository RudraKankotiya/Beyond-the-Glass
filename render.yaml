# Render Blueprint: creates the API as a web service (Dashboard > New > Blueprint > this repo).
# Values marked "sync: false" are asked for when the Blueprint is applied - see README "Deployment".
services:
  - type: web
    name: beyond-the-glass-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: MONGO_URI
        sync: false # MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true # Render creates a random secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false # e.g. https://beyond-the-glass.vercel.app
      - key: STORAGE_DRIVER
        value: cloudinary # the free instance has no persistent disk
      - key: CLOUDINARY_URL
        sync: false # cloudinary://API_KEY:API_SECRET@CLOUD_NAME
